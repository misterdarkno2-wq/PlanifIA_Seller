# Actualizaciones de seguridad y de versiones. Cada PR debe pasar las pruebas antes de fusionarse.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    groups:
      menores:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    groups:
      menores:
        update-types: [minor, patch]
  - package-ecosystem: gradle
    directory: "/src-tauri/gen/android"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
