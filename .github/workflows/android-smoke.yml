name: Android en emulador
# Compila el APK release (con R8, como el AAB de Google Play) y lo abre en emuladores de varias
# versiones de Android: comprueba que la interfaz aparezca, ejecuta los comandos nativos de
# anuncios y compras, cierra con Atrás, vuelve a abrir y recrea la actividad.
on:
  push:
    branches: ["main", "claude/**", "feature/**"]
    paths:
      - "src/**"
      - "src-tauri/**"
      - "scripts/android-*"
      - "package*.json"
      - ".github/workflows/android-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: rustup target add x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # Sólo en esta copia de prueba: bloques de prueba de AdMob (nunca tráfico real desde el
      # emulador), WebView depurable para ejecutar comandos y una clave de firma desechable.
      - name: Preparar la copia de prueba
        run: |
          cp src-tauri/gen/android/app/src/debug/res/values/admob.xml src-tauri/gen/android/app/src/main/res/values/admob.xml
          sed -i 's/^\(\s*\)super.onCreate(savedInstanceState)$/&\n\1WebView.setWebContentsDebuggingEnabled(true)/' src-tauri/gen/android/app/src/main/java/cl/planifia/app/MainActivity.kt
          grep -q setWebContentsDebuggingEnabled src-tauri/gen/android/app/src/main/java/cl/planifia/app/MainActivity.kt
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.jks" -alias smoke -storepass smoke-pass -keypass smoke-pass \
            -keyalg RSA -keysize 2048 -validity 2 -dname "CN=PlanifIA smoke"
      - name: Compilar APK release x86_64
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          PLANIFIA_ANDROID_STORE_PASSWORD: smoke-pass
          PLANIFIA_ANDROID_KEY_ALIAS: smoke
          PLANIFIA_ANDROID_KEY_PASSWORD: smoke-pass
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME" PLANIFIA_ANDROID_KEYSTORE="$RUNNER_TEMP/smoke.jks"
          npm run tauri -- android build --apk --target x86_64
          mkdir -p artifacts
          cp "$(find src-tauri/gen/android/app/build/outputs/apk -name '*release*.apk' | head -n 1)" artifacts/app-release.apk
          ls -la artifacts
      # Android 15+ con páginas de 16 KB no carga librerías alineadas a 4 KB (la app se cierra al abrir).
      - name: Comprobar alineación de 16 KB
        run: |
          ZIPALIGN="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n 1)zipalign"
          "$ZIPALIGN" -c -P 16 -v 4 artifacts/app-release.apk | grep -E "\.so|Verification"
          unzip -o -q artifacts/app-release.apk 'lib/*' -d "$RUNNER_TEMP/apk"
          # En el NDK de Linux llvm-readelf es un enlace simbólico (find -type f no lo encuentra).
          READELF="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$READELF" --version | head -n 2
          for so in "$RUNNER_TEMP"/apk/lib/*/*.so; do
            align=$("$READELF" -lW "$so" | awk '$1 == "LOAD" { print $NF }' | sort -u | paste -sd ' ')
            echo "$so: $align"
            case "$so" in */arm64-v8a/*|*/x86_64/*) [ "$align" = "0x4000" ] || { echo "::error::$so no está alineada a 16 KB (LOAD: ${align:-sin datos})"; exit 1; } ;; esac
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: artifacts/app-release.apk
          retention-days: 7

  emulador:
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 26 = minSdk (Android 8). 37 = targetSdk (Android 17): activa los cambios de
        # comportamiento que sólo aplican a apps que apuntan a esa versión. Google publica esa
        # imagen como "android-37.0": con "37" sdkmanager no la encuentra y el trabajo falla.
        api-level: [26, 29, 33, 35, 36, "37.0"]
        target: [google_apis]
        include:
          # Páginas de memoria de 16 KB (teléfonos con Android 15 o más nuevos): una .so alineada
          # a 4 KB no carga y la app se cierra al abrir.
          - api-level: "37.0"
            target: google_apis_ps16k
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: apk-release
          path: artifacts
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir la app en Android API ${{ matrix.api-level }} (${{ matrix.target }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Las imágenes de Android 17 tardan más de 10 minutos en arrancar en el runner.
          emulator-boot-timeout: 1500
          script: bash scripts/android-smoke.sh artifacts/app-release.apk
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-api${{ matrix.api-level }}-${{ matrix.target }}
          path: artifacts/android-smoke/
          retention-days: 7
