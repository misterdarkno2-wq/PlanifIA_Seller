name: Pruebas de la transformación
on:
  pull_request:
  push:
    branches: ["codex/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:edge
      - run: npm run check:edge
      - run: npx playwright install --with-deps chromium
      - run: npm run test:billing-ui
      - run: npm run test:companion-ui
      - run: npm run test:chat-ui
      - run: npm run test:legal-ui
      - run: npm run test:recovery-ui
      - run: npm run test:csp-ui
      - run: npm run test:i18n-ui
      - run: npm run build
