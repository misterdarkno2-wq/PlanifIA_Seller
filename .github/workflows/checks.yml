name: Pruebas de la transformación
on:
  pull_request:
  push:
    branches: ["codex/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:edge
      - run: npm run check:edge
      - run: npx playwright install --with-deps chromium
      - run: npm run test:billing-ui
      - run: npm run test:companion-ui
      - run: npm run build
