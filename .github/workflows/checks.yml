name: Pruebas de la transformación
on:
  pull_request:
  push:
    branches: ["codex/**"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:edge
      - run: npm run check:edge
      - run: npx playwright install --with-deps chromium
      - run: npm run test:billing-ui
      - run: npm run test:companion-ui
      - run: npm run test:chat-ui
      - run: npm run test:legal-ui
      - run: npm run test:csp-ui
      - run: npm run build
