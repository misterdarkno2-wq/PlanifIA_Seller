project_id = "planifia-seller"

# Autenticación. Ver docs/auditoria-legal-seguridad-2026-10-18.md, sección "Auth".
# Este archivo sirve para el entorno local (supabase start) y como propuesta para producción: en
# producción los mismos valores se cambian en el panel (Authentication) o con "supabase config push",
# que reemplaza la configuración remota. Revisa cada valor antes de aplicarlo.
[auth]
site_url = "https://planifia.cl/"
# Lista cerrada. En producción deja sólo las de planifia.cl: las de 127.0.0.1 y localhost son para
# desarrollo local, y la de github.io es la dirección anterior de la web.
additional_redirect_urls = ["https://planifia.cl/", "https://planifia.cl/#reset", "https://www.planifia.cl/", "https://www.planifia.cl/#reset", "http://127.0.0.1:5173/", "http://127.0.0.1:5173/#reset", "http://localhost:5173/", "http://localhost:5173/#reset", "https://misterdarkno2-wq.github.io/PlanifIA_Seller/", "https://misterdarkno2-wq.github.io/PlanifIA_Seller/#reset"]
# Contraseñas nuevas: al menos 10 caracteres con letras y números (la app ya lo exige al registrarse
# y al cambiarla). Las contraseñas existentes siguen sirviendo para iniciar sesión.
minimum_password_length = 10
password_requirements = "letters_digits"
# Un refresh token robado deja de servir en cuanto la app legítima lo renueva.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Límites por IP de Supabase Auth. Frenan la creación masiva de cuentas que acumulan créditos.
[auth.rate_limit]
# Correos por hora (confirmación y recuperación) con el SMTP de Supabase.
email_sent = 2
# Inicios de sesión y registros cada 5 minutos por IP.
sign_in_sign_ups = 30
# Verificaciones de enlaces y códigos cada 5 minutos por IP.
token_verifications = 30
# Renovaciones de sesión cada 5 minutos por IP.
token_refresh = 150

# CAPTCHA en registro, inicio de sesión y recuperación. NO lo actives todavía: la app aún no envía el
# token de Cloudflare Turnstile (captchaToken) y nadie podría entrar. Pasos en el informe de auditoría.
# [auth.captcha]
# enabled = true
# provider = "turnstile"
# secret = "env(SUPABASE_AUTH_CAPTCHA_SECRET)"

[auth.email]
enable_confirmations = true
# Cambiar el correo exige confirmar en el correo anterior y en el nuevo.
double_confirm_changes = true
# Cambiar la contraseña exige una sesión reciente (o reautenticación).
secure_password_change = true
# Tiempo mínimo entre dos correos a la misma dirección.
max_frequency = "1m0s"

[functions.goal-plan]
verify_jwt = false

[functions.billing]
verify_jwt = false

[functions.billing-return]
verify_jwt = false

[functions.billing-renew]
verify_jwt = false

# Verifican la sesión, el secreto de Pub/Sub o la firma de AdMob dentro de la función.
[functions.play-billing]
verify_jwt = false

[functions.play-rtdn]
verify_jwt = false

[functions.admob-ssv]
verify_jwt = false

[functions.lumi-chat]
verify_jwt = false

# Respaldo en la nube (Groq): verifica la sesión dentro de la función, como lumi-chat.
[functions.ai-fallback]
verify_jwt = false
