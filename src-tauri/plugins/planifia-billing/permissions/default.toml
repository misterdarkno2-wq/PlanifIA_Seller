"$schema" = "schemas/schema.json"

[default]
description = "Permite a la ventana principal consultar productos, comprar y restaurar compras de Google Play, y buscar e instalar actualizaciones."
permissions = [
  "allow-get-products",
  "allow-purchase",
  "allow-restore-purchases",
  "allow-finish-purchase",
  "allow-manage-subscriptions",
  "allow-open-external",
  "allow-check-update",
  "allow-start-update",
  "allow-register-listener",
  "allow-remove-listener",
]
